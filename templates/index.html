{% extends 'base.html' %}
{% block title %}
Todo home
{% endblock %}
{% block body %}
<div class="row mt-3">
  <div class="col-md-6 mx-auto">
    <div class="card">
      <div class="card-body">
        <form action="/add-todo" method="POST">

          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" name="title" id="title">
          </div>
          <div class="mb-3">
            <label for="desc" class="form-label">Description</label>
            <textarea class="form-control" name="desc" id="desc" rows="3"></textarea>
          </div>
          <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-outline-dark btn-sm">Submit</button>

          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-10 mx-auto mt-5">
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Title</th>
          <th scope="col">Description</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody>
        {% for todo in todolist %}
        <tr>
          <th scope="row">{{loop.index}}</th>
          <td>{{todo.title}}</td>
          <td>{{todo.desc}}</td>
          <td>
            <a href="/edit-todo/{{todo.sno}}" type="button" class="btn btn-outline-dark btn-sm">Edit</a>
            <a href="/delete-todo/{{todo.sno}}" type="button" class="btn btn-outline-dark btn-sm">Delete</a>
          </td>
        </tr>

        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
